<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{标题}}</title>
<style>
:root{color-scheme:light dark;--bg:#faf8f4;--ink:#27231e;--muted:#746b61;--line:#d9d0c5;--accent:#a6431f}@media(prefers-color-scheme:dark){:root{--bg:#191816;--ink:#eee7dd;--muted:#b7ab9d;--line:#51473c;--accent:#efac88}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.85 system-ui,"PingFang SC",sans-serif}a{color:var(--accent)}.layout{display:grid;grid-template-columns:220px minmax(0,820px);gap:48px;max-width:1180px;margin:auto;padding:48px 24px}nav{position:sticky;top:24px;align-self:start;font-size:14px}nav a{display:block;margin:12px 0}h1{font-size:clamp(30px,5vw,48px);line-height:1.3}h2{margin-top:2.5em;font-size:27px;scroll-margin-top:24px}h3{margin-top:1.8em;font-size:21px}.meta,figcaption,.notes{color:var(--muted);font-size:14px}header{border-bottom:1px solid var(--line);padding-bottom:24px}figure{margin:32px 0}img{display:block;width:100%;height:auto}blockquote{margin:28px 0;padding-left:20px;border-left:3px solid var(--accent)}.notes{border-top:1px solid var(--line);margin-top:40px;padding-top:20px}p{overflow-wrap:anywhere}@media(max-width:800px){.layout{display:block;padding:24px 20px}nav{position:static;border-bottom:1px solid var(--line);padding-bottom:20px}}@media print{nav{display:none}.layout{display:block;padding:0}body{background:white;color:black;font-size:11pt}figure,blockquote{break-inside:avoid}h2,h3{break-after:avoid}}
