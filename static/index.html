<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>实录工坊</title><link rel="stylesheet" href="/static/style.css"><main><header><small>SPEECH RECAP WORKSHOP</small><h1>实录工坊</h1><p>逐字稿进，忠实的现场实录出。先整理，再由你决定如何表达。</p></header><p id="status" role="status"></p><div class="layout"><aside><h2>稿件</h2><button id="new">新建稿件</button><div id="list"></div></aside><section><div id="create"><h2>导入逐字稿</h2><label>分享标题<input id="title"></label><label>导入 UTF-8 文本文件<input type="file" id="file" accept=".txt,.md"></label><label>逐字稿<textarea id="transcript" rows="12"></textarea></label><button id="add">创建稿件</button></div><div id="editor" hidden><h2 id="heading"></h2><details><summary>查看原始逐字稿</summary><pre id="source"></pre></details><p>离线演示仅保留原文；AI 整理会将本篇逐字稿发送到你配置的模型服务。</p><button id="demo">生成离线演示</button><button id="live">发送至模型并整理</button><h3>引擎初稿</h3><pre id="engine"></pre><button id="adopt">采用初稿到编辑区</button><label>人工编辑（Markdown）<textarea id="body" rows="18"></textarea></label><h3>脱敏疑点</h3><p>规则可能漏检。请同时核对原文与正文，确认保真、隐私及遗漏。</p><ul id="flags"></ul><label><input type="checkbox" id="reviewed">我已核对正文并完成人工脱敏复核</label><button id="save">保存正文与复核状态</button><p><a id="md">导出 Markdown</a> · <a id="html">导出 HTML</a>（请先保存）</p></div></section></div></main><script src="/static/app.js"></script></html>
